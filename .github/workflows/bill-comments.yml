name: Bill comments

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  pages: write
  actions: write   # to redeploy the Azure copy after an accepted edit

concurrency:
  group: bill-comments
  cancel-in-progress: false

jobs:
  label:
    # Tag comments posted from the website so the site can list them
    if: github.event.action != 'labeled' && contains(github.event.issue.body, '<!-- caren-bill-comment -->')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels: ['bill-comment'] });

  apply:
    # An editor approved the comment: merge its proposed text into website/bill.json
    if: github.event.action == 'labeled' && github.event.label.name == 'accepted' && contains(github.event.issue.body, '<!-- caren-bill-comment -->')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const apply = require('./.github/scripts/apply-accepted.js');
            await apply({ github, context, core });
      - name: Request GitHub Pages rebuild
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
      - name: Deploy the updated bill to Azure
        # Pushes made with the workflow token don't trigger other workflows, so start the deploy explicitly.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-server.yml --ref main || true
