<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learn Module</title>
  <meta name="description" content="A short, sourced lesson on the history of systemic racism, with every claim labeled documented, debated, or belief or myth.">
  <link rel="stylesheet" href="assets/site.css">
  <style>
    main.page { line-height: 1.65; }
    .crumbs { font-size: .86rem; margin-top: 14px; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .86rem; color: var(--muted); }
    section.s { border-top: 1px solid var(--line); padding-top: 4px; margin-top: 22px; }
    section.s h2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
    section.s ul { padding-left: 20px; }
    section.s li { margin: 6px 0; }
    .refs { font-size: .8rem; color: var(--muted); }
    .refs a { margin-right: 6px; }
    ol.sources li { font-size: .88rem; margin: 4px 0; }
    .finish { background: #eef4fb; border-radius: 10px; padding: 14px 16px; margin: 24px 0; }
    .quest-card { border: 2px solid #f2c14e; border-radius: 12px; padding: 14px 16px; margin: 16px 0; background: #fffbea; }
    .pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
    .maplinks a { display: inline-block; margin: 4px 8px 4px 0; }
  </style>
</head>
<body>
  <header id="siteHeader"></header>
  <main class="page" id="main">
    <p>Loading…</p>
  </main>
  <footer id="siteFooter"></footer>
  <script src="assets/site.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/learn.js"></script>
  <script>
  (function () {
    const L = CarenLearn, ui = L.ui, esc = ui.esc, main = document.getElementById('main');
    const id = new URLSearchParams(location.search).get('m');
    L.catalog().then(cat => {
      const i = cat.modules.findIndex(m => m.id === id);
      if (i < 0) { main.innerHTML = '<h1>Module not found</h1><p><a href="learn.html">See all modules</a></p>'; return; }
      const m = cat.modules[i];
      // Inside a learning path (?path=id), previous/next follow the path instead of the module order.
      const path = (cat.paths || []).find(p => p.id === new URLSearchParams(location.search).get('path') && p.modules.indexOf(m.id) >= 0);
      const pi = path ? path.modules.indexOf(m.id) : -1, byId = id => cat.modules.find(x => x.id === id);
      const prev = path ? (pi > 0 ? byId(path.modules[pi - 1]) : null) : cat.modules[i - 1];
      const next = path ? (pi < path.modules.length - 1 ? byId(path.modules[pi + 1]) : null) : cat.modules[i + 1];
      const pq = path ? '&path=' + path.id : '';
      document.title = 'Module ' + m.num + ': ' + m.title.split(':')[0];
      const srcIds = Object.keys(m.sourcesList || {});
      const refNum = k => srcIds.indexOf(k) + 1;
      let h = '<p class="crumbs"><a href="learn.html">Learn</a> › ' + (path ? '<a href="learn.html#path-' + path.id + '">' + path.icon + ' ' + esc(path.title) + '</a> › ' + (pi + 1) + ' / ' + path.modules.length : 'Module ' + m.num) + '</p>' +
        '<h1 data-narr="title">' + esc(m.title) + '</h1>' +
        '<div class="meta">' + (m.minutes ? '<span>' + m.minutes + ' min read</span>·' : '') +
        '<span>' + (m.status === 'outline' ? 'Outline: being written' : 'Draft, awaiting historian review') + '</span>·' +
        (m.status !== 'outline' ? '<a href="teach.html?m=' + m.id + '">🎓 Teach this</a>·' : '') +
        Object.keys(cat.labels).map(k => ui.chip(cat, k)).join(' ') + '</div>';
      if (m.status === 'outline') {
        h += '<p class="lede">' + esc(m.short) + '</p><h2>What this module will cover</h2><ul>' + m.topics.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>' +
          '<div class="callout info">This module is being written. Know this history well, or have sources to add? <a href="volunteer.html#reviewer">Join as a researcher or history reviewer</a>, or <a href="https://github.com/ProDataMan/CAREN-Act/issues/new?title=' + encodeURIComponent('[Learn] Module ' + m.num + ': ') + '" target="_blank" rel="noopener">suggest a source</a>.</div>';
      } else {
        if (window.CarenI18n && CarenI18n.lang !== 'en' && !m.translated) h += '<div class="callout" translate="no">Este módulo aún no está traducido al español; se muestra en inglés. <a href="volunteer.html">¿Puedes ayudar a traducirlo?</a></div>';
        h += '<div id="narr" class="narr" hidden></div>';
        h += '<p class="lede" data-narr="intro">' + esc(m.intro) + '</p>';
        h += m.sections.map((s, n) => '<section class="s" id="s' + (n + 1) + '"><h2><span data-narr="h' + n + '">' + esc(s.h) + '</span> ' + ui.chip(cat, s.label) + '</h2><div data-narr="s' + n + '">' + s.body + '</div>' +
          ((s.sources || []).length ? '<div class="refs">Sources: ' + s.sources.map(k => '<a href="#src-' + k + '">[' + refNum(k) + ']</a>').join('') + '</div>' : '') + '</section>').join('');
        if ((m.timeline || []).length) h += '<h2>Timeline</h2>' + ui.timeline(cat, m.timeline, false);
      }
      if ((m.map || []).length) h += '<h2>See it on the map</h2><p class="maplinks">' + m.map.map(x => '<a class="btn secondary" href="' + x.href + '">🗺 ' + esc(x.t) + '</a>').join('') + '</p>';
      if (m.status !== 'outline') {
        h += '<div class="finish" id="finish"></div>';
        h += '<div class="share-lesson" id="shareBox"><b>Share this lesson</b> <button class="btn secondary" type="button" id="shImg">Share image</button> <button class="btn secondary" type="button" id="shCopy">Copy link</button> <a class="btn secondary" id="shFb" target="_blank" rel="noopener">Facebook</a> <a class="btn secondary" id="shX" target="_blank" rel="noopener">X / Twitter</a></div>';
        if ((m.quiz || []).length) h += '<h2 id="quiz">Check what you learned</h2><p>Get ' + Math.ceil(m.quiz.length * cat.xp.quizPass) + ' of ' + m.quiz.length + ' right for ' + cat.xp.quiz + ' XP.</p><div id="quizBox"></div>';
        const q = cat.quests.find(x => x.id === m.quest);
        if (q) h += '<div class="quest-card"><b>Quest: ' + esc(q.title) + ' (' + q.xp + ' XP)</b><p style="margin:6px 0">' + esc(q.desc) + '</p><a class="btn" href="' + q.href + '">Go</a> <a class="btn secondary" href="learn.html#quests">All quests</a></div>';
      }
      if (srcIds.length) h += '<h2 id="sources">Sources</h2><ol class="sources">' + srcIds.map(k => {
        const s = m.sourcesList[k];
        return '<li id="src-' + k + '">' + (s.url ? '<a href="' + esc(s.url) + '"' + (/^https?:/.test(s.url) ? ' target="_blank" rel="noopener"' : '') + '>' + esc(s.t) + '</a>' : esc(s.t)) + '</li>';
      }).join('') + '</ol><p class="note">Some links go to encyclopedia overviews that cite the primary documents; reviewers are replacing them with the originals.</p>';
      h += '<div class="pager">' + (prev ? '<a href="module.html?m=' + prev.id + pq + '">← Module ' + prev.num + ': ' + esc(prev.title.split(':')[0]) + '</a>' : '<span></span>') +
        (next ? '<a href="module.html?m=' + next.id + pq + '">Module ' + next.num + ': ' + esc(next.title.split(':')[0]) + ' →</a>' : (path ? '<a href="learn.html#path-' + path.id + '">✓ Back to the path</a>' : '<a href="learn.html#quests">Quest board →</a>')) + '</div>';
      main.innerHTML = h;

      const finish = document.getElementById('finish');
      function drawFinish() {
        if (!finish) return;
        finish.innerHTML = L.has('read:' + m.id)
          ? '✓ <b>You finished this module.</b> ' + (next ? '<a href="module.html?m=' + next.id + pq + '">Next: ' + esc(next.title.split(':')[0]) + ' →</a>' : '')
          : '<b>Finished reading?</b> <button class="btn" type="button" id="markRead">Mark as read (+' + cat.xp.read + ' XP)</button>';
        const b = document.getElementById('markRead');
        if (b) b.addEventListener('click', () => ui.award('read:' + m.id, 'Module ' + m.num).then(drawFinish));
      }
      drawFinish();
      L.onChange(drawFinish);
      const qb = document.getElementById('quizBox');
      if (qb) {
        if (L.has('quiz:' + m.id)) qb.insertAdjacentHTML('beforebegin', '<p class="note">✓ You already passed this quiz. You can take it again for practice.</p>');
        ui.quiz(qb, m.quiz, { pass: cat.xp.quizPass, onPass: () => ui.award('quiz:' + m.id, 'Quiz passed') });
      }
      if (location.hash) { const t = document.querySelector(location.hash); if (t) t.scrollIntoView(); }
      L.sync();
      narrator(m);
      shareCard(m);
    });

    // ---- Share card: a 1080×1080 image with the lesson's title and key point, for social media.
    function shareCard(m) {
      if (!document.getElementById('shImg')) return;
      const lang = (window.CarenI18n && CarenI18n.lang) || 'en';
      const url = 'https://prodataman.github.io/CAREN-Act/website/module.html?m=' + m.id + (lang !== 'en' ? '&lang=' + lang : '');
      const text = m.title + ': ' + m.short;
      document.getElementById('shFb').href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url);
      document.getElementById('shX').href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(m.title) + '&url=' + encodeURIComponent(url);
      document.getElementById('shCopy').addEventListener('click', e => navigator.clipboard.writeText(text + ' ' + url).then(() => { e.target.textContent = '✓'; }));
      function wrap(g, t, x, y, maxW, lh, maxLines) {
        const words = t.split(' '); let line = '', n = 0;
        for (let i = 0; i < words.length; i++) {
          const test = line ? line + ' ' + words[i] : words[i];
          if (g.measureText(test).width > maxW && line) {
            if (++n === maxLines) { g.fillText(line.replace(/[,.;:]?$/, '…'), x, y); return y + lh; }
            g.fillText(line, x, y); y += lh; line = words[i];
          } else line = test;
        }
        g.fillText(line, x, y); return y + lh;
      }
      document.getElementById('shImg').addEventListener('click', () => {
        const c = document.createElement('canvas'); c.width = 1080; c.height = 1080;
        const g = c.getContext('2d'), F = 'system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
        g.fillStyle = '#0e2a47'; g.fillRect(0, 0, 1080, 1080);
        g.fillStyle = '#f2c14e'; g.fillRect(0, 0, 1080, 14);
        g.font = '700 30px ' + F; g.fillText((lang === 'es' ? 'APRENDE · MÓDULO ' : 'LEARN · MODULE ') + m.num, 80, 110);
        g.fillStyle = '#ffffff'; g.font = '800 66px ' + F;
        let y = wrap(g, m.title, 80, 220, 920, 78, 4);
        g.fillStyle = '#dbe6f3'; g.font = '400 38px ' + F;
        wrap(g, m.short, 80, y + 40, 920, 54, 7);
        g.fillStyle = '#f2c14e'; g.font = '700 34px ' + F;
        g.fillText(lang === 'es' ? 'Aprende la historia. Aprueba la Ley CAREN.' : 'Learn the history. Pass the CAREN Act.', 80, 960);
        g.fillStyle = '#dbe6f3'; g.font = '400 28px ' + F; g.fillText('prodataman.github.io/CAREN-Act', 80, 1010);
        c.toBlob(blob => {
          const file = new File([blob], 'caren-lesson-' + m.id + '.png', { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file], title: m.title, text: url }).catch(() => {});
          else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click(); }
        });
      });
    }

    // ---- Narration: audio/<lang>/<module>.<voice>.mp3 with sentence and word timings.
    // The current word is highlighted (and its sentence shaded) as it is read.
    function narrator(m) {
      const box = document.getElementById('narr'); if (!box) return;
      const lang = (window.CarenI18n && CarenI18n.lang) || 'en';
      const dir = 'audio/' + lang + '/';
      fetch(dir + 'index.json').then(r => r.ok ? r.json() : null).catch(() => null).then(idx => {
        const voices = idx && idx.modules && idx.modules[m.id];
        if (!voices || !voices.length) return;
        let pref = null; try { pref = localStorage.getItem('caren-voice'); } catch (e) { /* ignore */ }
        let voice = voices.indexOf(pref) >= 0 ? pref : voices[0];
        const fmt = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
        const $ = id => document.getElementById(id);
        box.hidden = false;
        box.innerHTML = '<button type="button" class="btn" id="nPlay">▶ Listen</button>' +
          '<input type="range" id="nSeek" min="0" max="1" step="0.1" value="0" aria-label="Position">' +
          '<span class="note" id="nTime">0:00</span>' +
          (voices.length > 1 ? '<select id="nVoice" aria-label="Voice">' + voices.map(v => '<option value="' + v + '"' + (v === voice ? ' selected' : '') + '>' + esc((idx.voices[v] || {}).label || v) + '</option>').join('') + '</select>' : '') +
          '<select id="nRate" aria-label="Speed"><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select>' +
          '<label class="note"><input type="checkbox" id="nFollow" checked> Follow along</label>';
        const audio = new Audio(); audio.preload = 'none';
        const hlWord = (window.CSS && CSS.highlights && window.Highlight) ? new Highlight() : null;
        const hlSent = hlWord ? new Highlight() : null;
        if (hlWord) { CSS.highlights.set('narration-sentence', hlSent); CSS.highlights.set('narration', hlWord); }
        let meta = null, located = [], cur = -1, curW = -1, raf = 0;

        // Find each sentence inside its data-narr element (ignoring whitespace), in order, and keep the
        // character map so individual words can be turned into Ranges.
        const flatCache = {};
        function flat(el) {
          const key = el.getAttribute('data-narr');
          if (flatCache[key]) return flatCache[key];
          let s = '', map = []; const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n;
          while ((n = w.nextNode())) for (let i = 0; i < n.nodeValue.length; i++) if (!/\s/.test(n.nodeValue[i])) { s += n.nodeValue[i]; map.push([n, i]); }
          return (flatCache[key] = { s, map });
        }
        function rangeOf(f, a, len) { const r = document.createRange(), x = f.map[a], y = f.map[a + len - 1]; r.setStart(x[0], x[1]); r.setEnd(y[0], y[1] + 1); return r; }
        function locateAll() {
          const cursors = {};
          located = meta.segments.map(seg => {
            const el = document.querySelector('[data-narr="' + seg.el + '"]'); if (!el) return null;
            const f = flat(el), want = seg.text.replace(/\s+/g, '');
            let at = f.s.indexOf(want, cursors[seg.el] || 0); if (at < 0) at = f.s.indexOf(want);
            if (at < 0) return { el };
            cursors[seg.el] = at + want.length;
            const words = []; let off = at;
            seg.text.split(/\s+/).filter(Boolean).forEach(t => { words.push([off, t.length]); off += t.length; });
            return { el, f, range: rangeOf(f, at, want.length), words };
          });
          window.CarenNarration = { audio, meta, located };
        }
        function find(t) { const s = meta.segments; for (let i = s.length - 1; i >= 0; i--) if (t >= s[i].start - 0.05) return t <= s[i].end + 0.5 ? i : -1; return -1; }
        function paint() {
          const t = audio.currentTime, i = find(t);
          if (i !== cur) {
            cur = i; curW = -1;
            document.querySelectorAll('.narr-active').forEach(e => e.classList.remove('narr-active'));
            if (hlSent) { hlSent.clear(); hlWord.clear(); }
            const Lx = located[i];
            if (Lx) {
              if (Lx.range && hlSent) hlSent.add(Lx.range); else Lx.el.classList.add('narr-active');
              if ($('nFollow').checked && !audio.paused) {
                const rect = (Lx.range || Lx.el).getBoundingClientRect();
                if (rect.top < 110 || rect.bottom > innerHeight - 60) window.scrollTo({ top: scrollY + rect.top - innerHeight / 3, behavior: 'smooth' });
              }
            }
          }
          const Lx = located[cur], seg = meta.segments[cur];
          if (hlWord && Lx && Lx.words && seg && seg.words) {
            let w = -1; for (let k = 0; k < seg.words.length; k++) { if (t >= seg.words[k][0] - 0.02) w = k; else break; }
            if (w !== curW && w >= 0 && Lx.words[w]) { curW = w; hlWord.clear(); hlWord.add(rangeOf(Lx.f, Lx.words[w][0], Lx.words[w][1])); }
          }
          $('nSeek').value = t; $('nTime').textContent = fmt(t) + ' / ' + fmt(meta.duration);
          if (!audio.paused) raf = requestAnimationFrame(paint);
        }
        function load(v, keepTime) {
          const t = keepTime ? audio.currentTime : 0, playing = !audio.paused;
          voice = v; try { localStorage.setItem('caren-voice', v); } catch (e) { /* ignore */ }
          return fetch(dir + m.id + '.' + v + '.json').then(r => r.json()).then(j => {
            meta = j; locateAll(); cur = -1;
            $('nSeek').max = meta.duration; $('nTime').textContent = fmt(0) + ' / ' + fmt(meta.duration);
            audio.src = dir + m.id + '.' + v + '.mp3';
            if (t) audio.addEventListener('loadedmetadata', () => { audio.currentTime = Math.min(t, meta.duration - 1); }, { once: true });
            if (playing) audio.play();
          });
        }
        load(voice);
        audio.addEventListener('play', () => { $('nPlay').textContent = '❚❚ Pause'; box.dataset.started = '1'; cancelAnimationFrame(raf); raf = requestAnimationFrame(paint); });
        audio.addEventListener('pause', () => { $('nPlay').textContent = '▶ Listen'; cancelAnimationFrame(raf); paint(); });
        audio.addEventListener('seeked', paint);
        audio.addEventListener('ended', () => { $('nPlay').textContent = '↺ Replay'; if (hlWord) { hlWord.clear(); hlSent.clear(); } if (!L.has('read:' + m.id)) ui.award('read:' + m.id, 'Lesson heard'); });
        $('nPlay').addEventListener('click', () => { audio.playbackRate = +$('nRate').value; audio.paused ? audio.play() : audio.pause(); });
        $('nSeek').addEventListener('input', () => { audio.currentTime = +$('nSeek').value; });
        $('nRate').addEventListener('change', () => { audio.playbackRate = +$('nRate').value; });
        if ($('nVoice')) $('nVoice').addEventListener('change', e => { load(e.target.value, true).then(() => { audio.playbackRate = +$('nRate').value; }); });
        // During playback, click any narrated sentence to jump to it.
        document.querySelectorAll('[data-narr]').forEach(el => el.addEventListener('click', e => {
          if (e.target.closest('a') || !box.dataset.started) return;
          const pos = document.caretPositionFromPoint ? document.caretPositionFromPoint(e.clientX, e.clientY) : (document.caretRangeFromPoint && document.caretRangeFromPoint(e.clientX, e.clientY));
          if (!pos) return;
          const node = pos.offsetNode || pos.startContainer, off = pos.offset != null ? pos.offset : pos.startOffset;
          const i = located.findIndex(x => x && x.range && x.range.isPointInRange(node, off));
          if (i >= 0) { audio.currentTime = meta.segments[i].start; if (audio.paused) audio.play(); }
        }));
      });
    }
  })();
  </script>
</body>
</html>
